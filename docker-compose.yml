services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: capacity_planner_dev
      POSTGRES_USER: capacity
      POSTGRES_PASSWORD: local-only-change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capacity -d capacity_planner_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["capacity_pg:/var/lib/postgresql/data"]
  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql://capacity:local-only-change-me@postgres/capacity_planner_dev
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build: .
    command: ["capacity-worker"]
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql://capacity:local-only-change-me@postgres/capacity_planner_dev
    depends_on:
      postgres: {condition: service_healthy}
  ui:
    build: .
    command: ["streamlit", "run", "src/capacity_planner/ui.py", "--server.address=0.0.0.0"]
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
volumes:
  capacity_pg:
