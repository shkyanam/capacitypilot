[project]
name = "capacity-planner-agent"
version = "1.0.0"
description = "Production-oriented autonomous capacity planning agent"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.6,<1",
  "mem0ai>=1.0,<2",
  "pandas>=2.2,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "streamlit>=1.47,<2",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7", "ruff>=0.12,<1"]

[project.scripts]
capacity-api = "capacity_planner.api:main"
capacity-worker = "capacity_planner.worker:main"
capacity-seed = "capacity_planner.seed:main"
capacity-news-enqueue = "capacity_planner.news_jobs:enqueue_main"
capacity-news-worker = "capacity_planner.news_worker:main"
capacity-memory-worker = "capacity_planner.memory_worker:main"
capacity-jira-worker = "capacity_planner.jira_worker:main"
capacity-slack-worker = "capacity_planner.slack_worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capacity_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
